name: CI health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: ci-health

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 check.py --config config.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
